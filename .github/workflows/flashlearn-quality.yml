name: Flash Learn quality
on:
  push:
    branches: [main, "feat/flashlearn-reliability-performance-exams"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund # existing lockfile currently out of sync
      - run: npm test
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests — desktop and mobile
        run: npx playwright test --config=playwright.public-smoke.config.ts
